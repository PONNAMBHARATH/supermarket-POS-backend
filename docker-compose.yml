services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: supermarket_pos
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_root_me}
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${DB_ROOT_PASSWORD:-change_root_me}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      DATABASE_URL: mysql://pos_user:${DB_PASSWORD:-change_me}@db:3306/supermarket_pos
    ports: ["${PORT:-8080}:8080"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  mysql_data:
